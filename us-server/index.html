    function bytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function openPack(password) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: bytes(PACK.salt), iterations: PACK.iterations, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: bytes(PACK.iv) },
        key,
        bytes(PACK.data)
      );
      const pack = JSON.parse(new TextDecoder().decode(plain));
      if (!pack || typeof pack.sub !== "string" || !(pack.sub.startsWith("https://") || pack.sub.startsWith("http://"))) {
        throw new Error("bad pack");
      }
      return pack;
    }

    function fileLink(anchor, text, filename, type) {
      const url = URL.createObjectURL(new Blob([text], { type: type }));
      anchor.href = url;
      anchor.download = filename;
    }

    function markCopied(button, label) {
      button.textContent = "已复制";
      window.setTimeout(function () {
        button.textContent = label;
      }, 1600);
    }

    async function copyText(button, text, label) {
      try {
        await navigator.clipboard.writeText(text);
        markCopied(button, label);
        return true;
      } catch (err) {
        return false;
      }
    }

      const subField = document.getElementById("sub");
      subField.value = pack.sub;
      function fitSub() {
        subField.style.height = "auto";
        subField.style.height = (subField.scrollHeight + 2) + "px";
      }
      fitSub();
      document.fonts.ready.then(fitSub);
      window.addEventListener("resize", fitSub);
      subField.addEventListener("focus", function () { subField.select(); });
      subField.addEventListener("click", function () { subField.select(); });
      document.getElementById("open-verge").href =
        "clash://install-config?url=" + encodeURIComponent(pack.sub) + "&name=" + encodeURIComponent("US West");
      document.getElementById("qr").src = URL.createObjectURL(new Blob([pack.qr], { type: "image/svg+xml" }));
      document.getElementById("vless").textContent = pack.vless;
      fileLink(document.getElementById("dl-clash"), pack.clash, "clash.yaml", "application/yaml");
      fileLink(document.getElementById("dl-mihomo"), pack.mihomo, "mihomo.yaml", "application/yaml");
      fileLink(document.getElementById("dl-sing"), pack.singbox, "sing-box.json", "application/json");
      document.getElementById("copy-vless").addEventListener("click", async function () {
        const node = document.getElementById("vless");
        const button = document.getElementById("copy-vless");
        const ok = await copyText(button, node.textContent.trim(), "复制链接");
        if (!ok) {
          const range = document.createRange();
          range.selectNodeContents(node);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          button.textContent = "请手动复制";
        }
      });
      document.getElementById("copy-sub").addEventListener("click", async function () {
        const button = document.getElementById("copy-sub");
        subField.focus();
        subField.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch (err) {
          ok = false;
        }
        if (!ok) ok = await copyText(button, subField.value, "复制订阅链接");
        if (ok) markCopied(button, "复制订阅链接");
        else button.textContent = "请手动复制";
      });
    }

    document.getElementById("unlock").addEventListener("submit", async function (event) {
      event.preventDefault();
      const input = document.getElementById("pw");
      const err = document.getElementById("err");
      const button = event.currentTarget.querySelector("button");
      const typed = input.value;
      err.hidden = true;
      button.disabled = true;
      button.textContent = "正在打开";
      try {
        const pack = await openPack(typed);
        input.value = "";
        show(pack);
      } catch (e) {
        err.hidden = false;
        button.disabled = false;
        button.textContent = "进入";
        input.focus();
        input.select();
      }
    });
  </script>
</body>
</html>
