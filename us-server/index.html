    function bytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function openPack(password) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: bytes(PACK.salt), iterations: PACK.iterations, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: bytes(PACK.iv) },
        key,
        bytes(PACK.data)
      );
      const pack = JSON.parse(new TextDecoder().decode(plain));
      if (!pack || typeof pack.sub !== "string" || !pack.sub.startsWith("https://")) {
        throw new Error("bad pack");
      }
      return pack;
    }

    function fileLink(anchor, text, filename, type) {
      const url = URL.createObjectURL(new Blob([text], { type: type }));
      anchor.href = url;
      anchor.download = filename;
    }

    function markCopied(button, label) {
      button.textContent = "已复制";
      window.setTimeout(function () {
        button.textContent = label;
      }, 1600);
    }

    async function copyText(button, text, label) {
      try {
        await navigator.clipboard.writeText(text);
        markCopied(button, label);
        return true;
      } catch (err) {
        return false;
      }
    }

    function show(pack) {
      document.querySelector("main").innerHTML =
        '<h1>US West</h1>' +
        '<p class="where">硅谷，端口 443</p>' +
        '<h2>Clash Verge</h2>' +
        '<p class="lead">把这个地址填进订阅。Mihomo、FlClash 和 ClashX Meta 也用它。</p>' +
        '<p class="url" id="sub"></p>' +
        '<p class="actions">' +
        '<a class="primary" id="open-verge">在 Clash Verge 中打开</a>' +
        '<button class="secondary" type="button" id="copy-sub">复制地址</button>' +
        '</p>' +
        '<h2>Shadowrocket</h2>' +
        '<figure><img id="qr" width="320" height="320" alt="Shadowrocket 节点二维码"><figcaption>扫这个码，会加入这条节点。v2rayN 用下面的链接。</figcaption></figure>' +
        '<p class="url" id="vless"></p>' +
        '<button class="link" type="button" id="copy-vless">复制链接</button>' +
        '<p class="more">' +
        '<a id="dl-clash">下载 clash.yaml</a>' +
        '<a id="dl-mihomo">下载 mihomo.yaml</a>' +
        '<a id="dl-sing">下载 sing-box 配置</a>' +
        '</p>' +
        '<p class="note">订阅地址本身就能拉取配置。不要把地址发出去。</p>';

      const subNode = document.getElementById("sub");
      pack.sub.split("/").forEach(function (part, index, all) {
        subNode.append(document.createTextNode(part));
        if (index < all.length - 1) {
          subNode.append(document.createTextNode("/"));
          subNode.append(document.createElement("wbr"));
        }
      });
      document.getElementById("open-verge").href =
        "clash://install-config?url=" + encodeURIComponent(pack.sub) + "&name=" + encodeURIComponent("US West");
      document.getElementById("qr").src = URL.createObjectURL(new Blob([pack.qr], { type: "image/svg+xml" }));
      document.getElementById("vless").textContent = pack.vless;
      fileLink(document.getElementById("dl-clash"), pack.clash, "clash.yaml", "application/yaml");
      fileLink(document.getElementById("dl-mihomo"), pack.mihomo, "mihomo.yaml", "application/yaml");
      fileLink(document.getElementById("dl-sing"), pack.singbox, "sing-box.json", "application/json");
      document.getElementById("copy-vless").addEventListener("click", async function () {
        const node = document.getElementById("vless");
        const button = document.getElementById("copy-vless");
        const ok = await copyText(button, node.textContent.trim(), "复制链接");
        if (!ok) {
          const range = document.createRange();
          range.selectNodeContents(node);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          button.textContent = "请手动复制";
        }
      });
      document.getElementById("copy-sub").addEventListener("click", async function () {
        const button = document.getElementById("copy-sub");
        const ok = await copyText(button, pack.sub, "复制地址");
        if (!ok) {
          const node = document.getElementById("sub");
          const range = document.createRange();
          range.selectNodeContents(node);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          button.textContent = "请手动复制";
        }
      });
    }

    document.getElementById("unlock").addEventListener("submit", async function (event) {
      event.preventDefault();
      const input = document.getElementById("pw");
      const err = document.getElementById("err");
      const button = event.currentTarget.querySelector("button");
      const typed = input.value;
      err.hidden = true;
      button.disabled = true;
      button.textContent = "正在打开";
      try {
        const pack = await openPack(typed);
        input.value = "";
        show(pack);
      } catch (e) {
        err.hidden = false;
        button.disabled = false;
        button.textContent = "进入";
        input.focus();
        input.select();
      }
    });
  </script>
</body>
</html>
