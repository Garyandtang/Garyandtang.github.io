    function bytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function openPack(password) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: bytes(PACK.salt), iterations: PACK.iterations, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: bytes(PACK.iv) },
        key,
        bytes(PACK.data)
      );
      const pack = JSON.parse(new TextDecoder().decode(plain));
      if (!pack || typeof pack.vless !== "string" || !pack.vless.startsWith("vless://")) {
        throw new Error("bad pack");
      }
      return pack;
    }

    function fileLink(anchor, text, filename, type) {
      const url = URL.createObjectURL(new Blob([text], { type: type }));
      anchor.href = url;
      anchor.download = filename;
    }

    function show(pack) {
      document.querySelector("main").innerHTML =
        '<h1>US West</h1>' +
        '<p class="where">硅谷</p>' +
        '<p class="where">端口 443</p>' +
        '<figure><img id="qr" width="360" height="360" alt="Shadowrocket 节点二维码"><figcaption>Shadowrocket 扫这个码，会加入这条节点。</figcaption></figure>' +
        '<h2>下载配置</h2>' +
        '<p class="lead">订阅地址已经撤下。Clash Mi、Clash Verge、FlClash 和 Mihomo Party 下载文件后导入。</p>' +
        '<p class="actions">' +
        '<a class="primary" id="dl-clash">下载 clash.yaml</a>' +
        '<a class="secondary" id="dl-mihomo">下载 mihomo.yaml</a>' +
        '<a class="secondary" id="dl-sing">下载 sing-box 配置</a>' +
        '</p>' +
        '<h2>节点链接</h2>' +
        '<p class="lead">Shadowrocket 和 v2rayN 用这一条。</p>' +
        '<p class="url" id="vless"></p>' +
        '<button type="button" id="copy">复制链接</button>' +
        '<p class="note">配置文件不挂在公开网址上。不要把密码发出去。</p>';

      document.getElementById("qr").src = URL.createObjectURL(new Blob([pack.qr], { type: "image/svg+xml" }));
      document.getElementById("vless").textContent = pack.vless;
      fileLink(document.getElementById("dl-clash"), pack.clash, "clash.yaml", "application/yaml");
      fileLink(document.getElementById("dl-mihomo"), pack.mihomo, "mihomo.yaml", "application/yaml");
      fileLink(document.getElementById("dl-sing"), pack.singbox, "sing-box.json", "application/json");
      document.getElementById("copy").addEventListener("click", async function () {
        const button = document.getElementById("copy");
        const url = document.getElementById("vless").textContent.trim();
        try {
          await navigator.clipboard.writeText(url);
          button.textContent = "已复制";
        } catch (err) {
          const range = document.createRange();
          range.selectNodeContents(document.getElementById("vless"));
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          button.textContent = "请手动复制";
        }
      });
    }

    document.getElementById("unlock").addEventListener("submit", async function (event) {
      event.preventDefault();
      const input = document.getElementById("pw");
      const err = document.getElementById("err");
      const button = event.currentTarget.querySelector("button");
      const password = input.value;
      err.hidden = true;
      button.disabled = true;
      button.textContent = "正在打开";
      try {
        const pack = await openPack(password);
        input.value = "";
        show(pack);
      } catch (e) {
        err.hidden = false;
        button.disabled = false;
        button.textContent = "进入";
        input.focus();
        input.select();
      }
    });
  </script>
